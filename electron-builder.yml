electronVersion: 39.2.6
appId: tools.razum.hermes-desktop
# store = без LZMA-сжатия. Портативная сборка нужна только для локального
# тестирования разработчиком, не для дистрибуции — на этой Linux-машине без
# wine быстрее собрать несжатый exe (секунды вместо нескольких минут на LZMA),
# чем упираться в лимит времени одного вызова инструмента сборки.
compression: store
productName: РАЗУМ Ассистент
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/build/Release/*.node
win:
  executableName: hermes-agent
  extraResources:
    - from: resources/bin/win
      to: bin
  target:
    - nsis
    - portable
  # Подпись кода. Помимо привычного «неизвестный издатель» в Windows, без неё
  # корпоративные средства защиты не дают приложению доступ к устройствам:
  # Kaspersky Endpoint Security блокирует неподписанным программам микрофон
  # (компонент «Предотвращение вторжений»), и приложение видит это как
  # NotReadableError из getUserMedia. Правило в политике безопасности можно
  # привязать к сертификату издателя — тогда оно переживает смену версий и
  # путей, в отличие от правила по контрольной сумме файла.
  #
  # Сертификат в репозиторий не кладётся, а передаётся окружением сборки:
  #   CSC_LINK          — путь или base64 к .pfx
  #   CSC_KEY_PASSWORD  — пароль к нему
  # либо, если сертификат уже в хранилище Windows, CSC_NAME с его subject.
  # Если ничего не задано, electron-builder просто пропускает подпись и сборка
  # проходит как раньше.
  #
  # Подписывать нужно не только сам exe, но и бинари из resources/bin:
  # микрофон открывает главный процесс, а voice-sidecar.exe делает запись —
  # права антивирус выдаёт каждому исполняемому файлу отдельно.
  signExts:
    - .exe
    - .dll
    - .node
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  vendor: Nous Research
  category: Utility
  synopsis: Self-improving AI assistant desktop app
  description: >-
    Hermes One is a native desktop app for installing, configuring, and chatting
    with Hermes Agent — a self-improving AI assistant with tool use, multi-platform
    messaging, and a closed learning loop.
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  # Run chmod 4755 on chrome-sandbox so Electron's setuid sandbox helper
  # works on modern Linux distros that disable unprivileged user
  # namespaces (Ubuntu 24.04+, etc.). Closes #395.
  afterInstall: build/linux-after-install.sh
rpm:
  artifactName: ${name}-${version}.${ext}
  # Same SUID fix for .rpm consumers (Fedora 40+ also restricts userns).
  afterInstall: build/linux-after-install.sh
npmRebuild: false
publish:
  provider: github
  owner: RAZUM-DC
  repo: hermes-desktop
