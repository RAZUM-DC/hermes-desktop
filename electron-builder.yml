electronVersion: 39.2.6
appId: tools.razum.hermes-desktop
# store = без LZMA-сжатия. Портативная сборка нужна только для локального
# тестирования разработчиком, не для дистрибуции — на этой Linux-машине без
# wine быстрее собрать несжатый exe (секунды вместо нескольких минут на LZMA),
# чем упираться в лимит времени одного вызова инструмента сборки.
compression: store
productName: РАЗУМ Ассистент
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/build/Release/*.node
win:
  executableName: hermes-agent
  extraResources:
    - from: resources/bin/win
      to: bin
  target:
    - nsis
    - portable
  # Сборка идёт на Linux-хосте без wine: и подпись через signtool.exe, и
  # встраивание иконки/version-info через rcedit (signAndEditExecutable)
  # шеллятся в wine, которого здесь нет. Ни то ни другое не влияет на сам
  # РАЗУМ-логотип внутри приложения (это React-компонент SidebarBrand,
  # рендерящий hermes-one.svg) — только на файловую иконку exe в Проводнике
  # и метаданные (ProductName/FileDescription) в его свойствах.
  signAndEditExecutable: false
  signExts:
    - "!.exe"
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  vendor: Nous Research
  category: Utility
  synopsis: Self-improving AI assistant desktop app
  description: >-
    Hermes One is a native desktop app for installing, configuring, and chatting
    with Hermes Agent — a self-improving AI assistant with tool use, multi-platform
    messaging, and a closed learning loop.
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  # Run chmod 4755 on chrome-sandbox so Electron's setuid sandbox helper
  # works on modern Linux distros that disable unprivileged user
  # namespaces (Ubuntu 24.04+, etc.). Closes #395.
  afterInstall: build/linux-after-install.sh
rpm:
  artifactName: ${name}-${version}.${ext}
  # Same SUID fix for .rpm consumers (Fedora 40+ also restricts userns).
  afterInstall: build/linux-after-install.sh
npmRebuild: false
publish:
  provider: github
  owner: RAZUM-DC
  repo: hermes-desktop
