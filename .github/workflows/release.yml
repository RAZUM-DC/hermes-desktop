name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all build jobs but skip publish (no tag, no GitHub Release)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.check.outputs.exists }}
      is_dry_run: ${{ steps.mode.outputs.is_dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: v$VERSION"

      - name: Check if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — only an explicit dry run will build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute dry-run flag
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "is_dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: builds will run, publish will be skipped."
          else
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Real release: publish will run if tag does not exist."
          fi

  release_mac:
    name: Build macOS (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false' || needs.prepare.outputs.is_dry_run == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native dependencies for target arch
        run: npx electron-builder install-app-deps --arch=${{ matrix.arch }}

      - name: Build app
        env:
          VITE_ANALYTICS_BASE_URL: ${{ vars.VITE_ANALYTICS_BASE_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
        run: npm run build

      - name: Stage App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_BASE64:-}" ] || [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${CSC_LINK:-}" ]; then
            echo "Signed releases require MAC_CSC_LINK, ASC_API_KEY, ASC_KEY_ID and ASC_ISSUER_ID. For testing, run the separate macOS Test Build workflow." >&2
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/appstore"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Package macOS artifacts
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --config.forceCodeSigning=true --publish never

      - name: Verify native module architecture
        run: bash scripts/verify-macos-native-arch.sh ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-artifacts
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap

  release_linux:
    name: Build Linux (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false' || needs.prepare.outputs.is_dry_run == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-latest
            targets: AppImage deb rpm
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            targets: AppImage
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native dependencies for target arch
        run: npx electron-builder install-app-deps --arch=${{ matrix.arch }}

      - name: Build app
        env:
          VITE_ANALYTICS_BASE_URL: ${{ vars.VITE_ANALYTICS_BASE_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
        run: npm run build

      - name: Install rpmbuild
        if: contains(matrix.targets, 'rpm')
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package Linux artifacts
        run: npx electron-builder --linux ${{ matrix.targets }} --${{ matrix.arch }} --publish never

      - name: Upload x64 artifacts
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-artifacts
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml

      - name: Upload arm64 artifacts
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/latest-linux-arm64.yml

  release_windows:
    name: Build Windows
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false' || needs.prepare.outputs.is_dry_run == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          VITE_ANALYTICS_BASE_URL: ${{ vars.VITE_ANALYTICS_BASE_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
        run: npm run build

      # Подпись кода. Без неё корпоративные средства защиты не дают
      # приложению доступ к устройствам: Kaspersky Endpoint Security
      # блокирует неподписанным программам микрофон, и приложение видит это
      # как отказ записи. Поэтому релизная сборка обязана быть подписанной,
      # иначе диктовка у части пользователей не работает вовсе.
      #
      # Если секреты не заданы, переменные приходят пустыми, electron-builder
      # просто пропускает подпись, и сборка идёт как раньше — ломаться тут
      # нечему.
      - name: Package Windows artifacts
        env:
          # Keep existing Windows secrets; Apple uses separate MAC_CSC_* secrets.
          WIN_CSC_LINK: ${{ secrets.CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis portable msi --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.msi
            dist/latest.yml

  generate_winget:
    name: Generate winget manifests
    needs: [prepare, release_windows]
    if: needs.prepare.outputs.tag_exists == 'false' || needs.prepare.outputs.is_dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist/

      - name: Generate winget manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_OWNER: fathah
        run: node scripts/generate-winget-manifests.mjs

      - name: Upload winget manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ needs.prepare.outputs.version }}
          path: dist/winget/

  publish:
    name: Validate and Publish Release
    needs: [prepare, release_mac, release_linux, release_windows]
    # Dry runs validate the same complete artifact set, including existing versions.
    if: needs.prepare.outputs.tag_exists == 'false' || needs.prepare.outputs.is_dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          path: artifacts
          merge-multiple: true

      - name: Verify complete artifacts and generate macOS update metadata
        id: artifacts
        run: node scripts/prepare-release-artifacts.mjs artifacts

      # No tag is created until every platform has built and all files are present.
      - name: Create tag
        if: needs.prepare.outputs.is_dry_run == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.prepare.outputs.tag }}
          git push origin ${{ needs.prepare.outputs.tag }}

      - name: Publish GitHub release
        if: needs.prepare.outputs.is_dry_run == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Hermes Desktop ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.artifacts.outputs.files }}

  rebuild_landing_page:
    name: Rebuild landing page
    needs: [prepare, publish]
    # Only after a real release that actually published a new tag.
    if: needs.prepare.outputs.is_dry_run == 'false' && needs.prepare.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release to propagate
        # Give GitHub's releases/latest API time to settle before the landing
        # page rebuilds and re-fetches the latest version.
        run: sleep 300

      - name: Trigger landing page deploy
        # SITE_DEPLOY_TOKEN is a fine-grained PAT with "Actions: read and write"
        # on fathah/hermes-landing-page. The default GITHUB_TOKEN cannot dispatch
        # workflows in another repository.
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          gh workflow run deploy.yml \
            --repo fathah/hermes-landing-page \
            --ref main
