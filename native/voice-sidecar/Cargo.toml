[package]
name = "hermes-voice-sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voice-sidecar"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
windows = { version = "0.54", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
] }
hound = "3.5.1"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.16"
rustfft = "6.4.1"
serde_json = "1.0.151"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
