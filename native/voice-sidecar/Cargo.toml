[package]
name = "hermes-voice-sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voice-sidecar"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = false

[dependencies]
anyhow = "1.0.104"
byteorder = "1.5.0"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
windows = { version = "0.54", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
] }
hound = "3.5.1"
rand = "0.10.3"
serde_json = "1.0.151"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex", "progressbar"] }
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
